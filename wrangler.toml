name = "bokerr-api"
main = "src/index.ts"
compatibility_date = "2026-10-18"
account_id = "f5be5b6566389f0a3891e4aef606cab7"

[durable_objects]
bindings = [
  { name = "POKER_TABLE", class_name = "PokerTable" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PokerTable"]

[[d1_databases]]
binding = "DB"
database_name = "bokerr"
database_id = "17620c13-4cf7-475d-91d0-4de65e83a3a7"

[[kv_namespaces]]
binding = "SESSION_KV"
id = "1fa59ee8c5fd43d68d205646bcdf7871"

[vars]
ALLOWED_ORIGINS = "https://appassets.androidplatform.net,https://bdkxbvdkdbs-source.github.io,http://localhost:5173,http://127.0.0.1:5173"

# Set ADMIN_TOKEN with `wrangler secret put ADMIN_TOKEN`; never commit its value.
