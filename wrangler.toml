name = "bokerr-api"
main = "src/index.ts"
compatibility_date = "2026-10-18"
account_id = "f5be5b6566389f0a3891e4aef606cab7"

[durable_objects]
bindings = [
  { name = "POKER_TABLE", class_name = "PokerTable" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PokerTable"]

[[d1_databases]]
binding = "DB"
database_name = "bokerr"
database_id = "17620c13-4cf7-475d-91d0-4de65e83a3a7"

[vars]
ALLOWED_ORIGIN = "https://your-app.example"

# Set these with `wrangler secret put ADMIN_TOKEN` and `wrangler secret put SMS_SIGNING_SECRET`.
