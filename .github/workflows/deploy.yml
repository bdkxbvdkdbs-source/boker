name: Deploy Bokerr Backend Worker

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Resolve or create D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          database_id="$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const rows=JSON.parse(s);const row=rows.find(x=>x.name==="bokerr");process.stdout.write(row?.uuid||row?.database_id||"")})')"
          if [ -z "$database_id" ]; then
            database_id="$(npx wrangler d1 create bokerr --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);process.stdout.write(x.uuid||x.database_id||x.result?.uuid||"")})')"
          fi
          test -n "$database_id"
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$database_id/" wrangler.toml
          npx wrangler d1 execute bokerr --remote --file schema.sql
      - name: Deploy Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
